[package]
name = "encrypt"
version = "1.0.0"
edition = "2021"
authors = ["Encrypt Team"]
description = "A top-level secrets orchestrator. Not just another .env tool — this one encrypts, locks, and sets you up for secure local and team dev."
license = "MIT"
repository = ""
homepage = ""

[[bin]]
name = "encrypt"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "color"] }

# Crypto libraries
ring = "0.17"
aes-gcm = "0.10"
base64 = "0.21"
hex = "0.4"

# File operations and JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Terminal colors and progress
colored = "2.0"
indicatif = "0.17"

# Environment variables
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"
